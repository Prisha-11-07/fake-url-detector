<!DOCTYPE html>
<html>
<head>
    <title>MovieVerse | Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba") no-repeat center center/cover;
            height: 100vh;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.7);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            color: white;
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkred;
        }

        .links {
            margin-top: 15px;
        }

        .links a {
            color: #ccc;
            text-decoration: none;
            margin: 0 10px;
        }

        .links a:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="overlay">
    <div class="box">
        <h1>🎬 MovieVerse</h1>
        <p>Sign in to continue</p>

        <input type="text" placeholder="Email"><br>
        <input type="password" placeholder="Password"><br>

        <button>Login</button>

        <div class="links">
            <a href="/movies">Browse Movies</a> |
            <a href="/offers">Offers</a>
        </div>
    </div>
</div>

</body>
</html>
