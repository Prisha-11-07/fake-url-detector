<!DOCTYPE html>
<html>
<head>
    <title>MovieVerse | Watch & Explore Movies</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
        }
        header {
            background: #222;
            color: white;
            padding: 15px;
            font-size: 24px;
        }
        .container {
            margin-top: 50px;
        }
        input {
            padding: 10px;
            width: 250px;
        }
        button {
            padding: 10px;
            background: #ff4c4c;
            color: white;
            border: none;
        }
        .box {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            box-shadow: 0 0 10px gray;
        }
    </style>
</head>

<body>

<header>
🎬 MovieVerse
</header>

<div class="container">
    <div class="box">
        <h2>Login to Watch Movies</h2>
        <p>Access latest movies and exclusive content</p>

        <input type="text" placeholder="Enter Email"><br><br>
        <input type="password" placeholder="Enter Password"><br><br>

        <button>Login</button>
    </div>
</div>

</body>
</html>
